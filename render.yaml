# Render Blueprint: deploys SolveFirst as two free services from this GitHub repo.
#   In Render: New -> Blueprint -> pick this repo -> fill in the values Render asks for.
# Values marked "sync: false" are secrets or per-deployment settings. Render asks for them in
# its dashboard and keeps them there; they are never written in this file or in the repo.

services:
  # The FastAPI backend.
  - type: web
    name: solvefirst-api
    runtime: python
    plan: free # without this line Render picks a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        sync: false
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        sync: false
      # The web app's address, e.g. https://solvefirst-web.onrender.com (allowed by CORS).
      - key: FRONTEND_ORIGINS
        sync: false
      # TIDB_CA_PATH is left out on purpose: the backend then uses certifi's certificates.

  # The React web app, built once and served as static files.
  - type: web
    name: solvefirst-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # Send every address (e.g. /documents/abc) to the app, so refreshing a page works.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      # The backend's address, e.g. https://solvefirst-api.onrender.com (used at build time).
      - key: VITE_API_URL
        sync: false
